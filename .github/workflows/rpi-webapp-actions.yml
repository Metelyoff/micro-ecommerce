name: Deploy web app

on:
  push:
    branches: [k8s,main]
    paths:
      - 'webapp/**'
#      - '.github/workflows/rpi-webapp-actions.yml'

env:
  IMAGE_NAME: ${{ secrets.WEBAPP_IMAGE_NAME }}
  ENV_PROFILE: ${{ secrets.ENV_PROFILE }}

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: ${{ secrets.ENVIRONMENT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./webapp
          file: ./webapp/Dockerfile
          platforms: linux/arm64
          builder: default
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=shared-cache
          cache-to: type=gha,mode=max,scope=shared-cache

  deploy:
    runs-on: self-hosted
    environment: ${{ secrets.ENVIRONMENT }}
    needs: build-and-push
    env:
      ENV_PROFILE: ${{ env.ENV_PROFILE }}
      DOMAIN: ${{ secrets.DOMAIN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: Prepare ENV variables
        run: |
          cp webapp/k8s.yaml template.yaml
          envsubst \
            '${ENV_PROFILE} ${IMAGE_NAME} ${DOMAIN}' \
            < template.yaml > webapp/k8s.yaml

      - name: Apply manifest
        run: |
          kubectl apply -f webapp/k8s.yaml --kubeconfig ~/.kube/config
