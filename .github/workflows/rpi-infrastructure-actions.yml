name: Deploy infrastructure

on:
  push:
    branches: [main, k8s]
    paths:
      - 'inventory-service/**'
      - 'order-service/**'
      - 'payment-service/**'
      - 'webapp/**'
      - '.github/workflows/rpi-infrastructure-actions.yml'
      - 'k8s-micro-ecommerce.yaml'

  workflow_dispatch:
    inputs:
      triggerStart:
        description: 'Start workflow'
        required: true
        type: boolean
        default: false
      triggerDeploy:
        description: 'Deploy to cluster'
        required: true
        type: boolean
        default: false

env:
  IMAGE_NAME: ${{ secrets.INFRASTRUCTURE_IMAGE_NAME }}
  BUILDX_CACHE_DIR: /home/pi/.buildx-cache

jobs:
  tests:
    if: ${{ github.event.inputs.triggerStart == 'true' }}
    runs-on: self-hosted
    environment: rpc3s
    strategy:
      matrix:
        service: [ inventory-service ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.service }}-${{ hashFiles(format('{0}/**/*.gradle*', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.service }}-

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  build-and-push-backend:
    runs-on: self-hosted
    environment: rpc3s
    needs: tests
    strategy:
      matrix:
        service: [ inventory-service, order-service, payment-service ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.service }}-${{ hashFiles(format('{0}/**/*.gradle*', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.service }}-

      - name: Build app
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --no-daemon
          cp build/libs/*.jar app.jar

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Configure Docker Buildx cache
        run: mkdir -p ${{ env.BUILDX_CACHE_DIR }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.service }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_DIR }}
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_DIR }},mode=max

  build-and-push-fe:
    runs-on: self-hosted
    needs: tests
    environment: rpc3s
    strategy:
      matrix:
        service: [ webapp ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache NPM
        uses: actions/cache@v4
        with:
          path: ${{ matrix.service }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles(format('{0}/package-lock.json', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies & build frontend
        working-directory: ${{ matrix.service }}
        run: |
          npm ci
          npm run build

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Configure Docker Buildx cache
        run: mkdir -p ${{ env.BUILDX_CACHE_DIR }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.service }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_DIR }}
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_DIR }},mode=max

  deploy:
    if: ${{ github.event.inputs.triggerDeploy == 'true' }}
    runs-on: self-hosted
    environment: rpc3s
    needs: [build-and-push-backend, build-and-push-fe]
    env:
      ENV_PROFILE: ${{ secrets.ENV_PROFILE }}
      DOMAIN: ${{ secrets.DOMAIN }}
      GRAFANA_CONTACT_POINT_EMAILS: ${{ secrets.GRAFANA_CONTACT_POINT_EMAILS }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      ORDER_POSTGRES_USER: ${{ secrets.ORDER_POSTGRES_USER }}
      ORDER_POSTGRES_PASSWORD: ${{ secrets.ORDER_POSTGRES_PASSWORD }}
      PAYMENT_POSTGRES_USER: ${{ secrets.PAYMENT_POSTGRES_USER }}
      PAYMENT_POSTGRES_PASSWORD: ${{ secrets.PAYMENT_POSTGRES_PASSWORD }}
      INVENTORY_POSTGRES_USER: ${{ secrets.INVENTORY_POSTGRES_USER }}
      INVENTORY_POSTGRES_PASSWORD: ${{ secrets.INVENTORY_POSTGRES_PASSWORD }}
      INVENTORY_SERVICE_POSTGRES_USER: ${{ secrets.INVENTORY_SERVICE_POSTGRES_USER }}
      INVENTORY_SERVICE_POSTGRES_PASSWORD: ${{ secrets.INVENTORY_SERVICE_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: Prepare ENV variables
        run: |
          cp k8s-micro-ecommerce.yaml template.yaml
          envsubst \
            '${ENV_PROFILE} ${DOMAIN} ${GRAFANA_CONTACT_POINT_EMAILS} ${IMAGE_NAME} ${ORDER_POSTGRES_USER} ${ORDER_POSTGRES_PASSWORD} ${PAYMENT_POSTGRES_USER} ${PAYMENT_POSTGRES_PASSWORD} ${INVENTORY_POSTGRES_USER} ${INVENTORY_POSTGRES_PASSWORD} ${INVENTORY_SERVICE_POSTGRES_USER} ${INVENTORY_SERVICE_POSTGRES_PASSWORD} ${CLOUDFLARE_TUNNEL_TOKEN}' \
            < template.yaml > k8s-micro-ecommerce.yaml

      - name: Validate manifests
        run: kubectl apply --dry-run=client -f k8s-micro-ecommerce.yaml --kubeconfig ~/.kube/config

      - name: Apply manifest
        run: kubectl apply -f k8s-micro-ecommerce.yaml --kubeconfig ~/.kube/config

