name: Deploy infrastructure

on:
  push:
    branches: [main, k8s]
    paths:
      - 'inventory-service/**'
      - 'order-service/**'
      - 'payment-service/**'
      - 'webapp/**'
      - '.github/workflows/rpi-infrastructure-actions.yml'

  workflow_dispatch:
    inputs:
      triggerTests:
        description: 'Test'
        required: true
        type: boolean
        default: false
      triggerBuild:
        description: 'Build and push'
        required: true
        type: boolean
        default: false
      triggerDeploy:
        description: 'Deploy'
        required: true
        type: boolean
        default: false

env:
  IMAGE_NAME: ${{ secrets.INFRASTRUCTURE_IMAGE_NAME }}

jobs:
  tests:
    if: ${{ github.event.inputs.triggerTests == 'true' && matrix.service != 'webapp' }}
    runs-on: self-hosted
    environment: rpc3s
    strategy:
      matrix:
        service: [ inventory-service, order-service, payment-service, webapp ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle wrapper permissions
        run: chmod +x ${{ matrix.service }}/gradlew

      - name: Verify Docker socket is available
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "Docker is not available or not running. Cannot proceed with Testcontainers."
            exit 1
          else
            echo "Docker is running. Proceeding with Testcontainers."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./gradlew clean test --no-daemon

  build-and-push:
    if: ${{ github.event.inputs.triggerBuild == 'true' }}
    runs-on: self-hosted
    environment: rpc3s
    needs: tests
    strategy:
      matrix:
        service: [ inventory-service, order-service, payment-service, webapp ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        if: matrix.service != 'webapp'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle wrapper permissions
        if: matrix.service != 'webapp'
        run: chmod +x ${{ matrix.service }}/gradlew

      - name: Cache Gradle
        if: matrix.service != 'webapp'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build JAR with Gradle
        if: matrix.service != 'webapp'
        working-directory: ${{ matrix.service }}
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore Docker cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-${{ matrix.service }}
          key: ${{ runner.os }}-buildx-${{ matrix.service }}-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service }}-

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |
            image=moby/buildkit:latest
            network=host
          buildkitd-flags: --debug

      - name: Build and push Docker image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ matrix.service }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.service }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.service }},mode=max

  deploy:
    if: ${{ github.event.inputs.triggerDeploy == 'true' }}
    runs-on: self-hosted
    environment: rpc3s
    needs: build-and-push
    env:
      ENV_PROFILE: ${{ secrets.ENV_PROFILE }}
      DOMAIN: ${{ secrets.DOMAIN }}
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      ORDER_POSTGRES_USER: ${{ secrets.ORDER_POSTGRES_USER }}
      ORDER_POSTGRES_PASSWORD: ${{ secrets.ORDER_POSTGRES_PASSWORD }}
      PAYMENT_POSTGRES_USER: ${{ secrets.PAYMENT_POSTGRES_USER }}
      PAYMENT_POSTGRES_PASSWORD: ${{ secrets.PAYMENT_POSTGRES_PASSWORD }}
      INVENTORY_POSTGRES_USER: ${{ secrets.INVENTORY_POSTGRES_USER }}
      INVENTORY_POSTGRES_PASSWORD: ${{ secrets.INVENTORY_POSTGRES_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: Prepare ENV variables
        run: |
          cp k8s-micro-ecommerce.yaml template.yaml
          envsubst \
            '${ENV_PROFILE} ${DOMAIN} ${IMAGE_NAME} ${ORDER_POSTGRES_USER} ${ORDER_POSTGRES_PASSWORD} ${PAYMENT_POSTGRES_USER} ${PAYMENT_POSTGRES_PASSWORD} ${INVENTORY_POSTGRES_USER} ${INVENTORY_POSTGRES_PASSWORD} ${CLOUDFLARE_TUNNEL_TOKEN}' \
            < template.yaml > k8s-micro-ecommerce.yaml

      - name: Check cluster context
        run: kubectl config current-context --kubeconfig ~/.kube/config

      - name: Validate manifests
        run: kubectl apply --dry-run=client -f k8s-micro-ecommerce.yaml --kubeconfig ~/.kube/config

      - name: Apply manifest
        run: kubectl apply -f k8s-micro-ecommerce.yaml --kubeconfig ~/.kube/config

