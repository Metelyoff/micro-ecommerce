name: Deploy inventory service

on:
  push:
    branches: [k8s, main]
    paths:
      - 'inventory-service/**'
      - '.github/workflows/rpi-inventory-actions.yml'

env:
  INVENTORY_IMAGE_NAME: ${{ secrets.INVENTORY_IMAGE_NAME }}
  INVENTORY_IMAGE_TAG: ${{ github.sha }}
  DOCKER_CONTEXT_DIR: docker-context

jobs:
  test:
    runs-on: self-hosted
    environment: rpc3s
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle wrapper permissions
        run: chmod +x inventory-service/gradlew

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1/
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify Docker socket is available
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "Docker is not available or not running. Cannot proceed with Testcontainers."
            exit 1
          else
            echo "Docker is running. Proceeding with tests."
          fi

      - name: Run tests with reports (without clean)
        working-directory: inventory-service
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: inventory-service/build/reports/tests/test

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: inventory-service/build/test-results/test/*.xml
          reporter: java-junit

  build-and-push:
    runs-on: self-hosted
    environment: rpc3s
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle wrapper permissions
        run: chmod +x inventory-service/gradlew

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/files-2.1/
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build JAR with Gradle
        working-directory: inventory-service
        run: ./gradlew bootJar -x test --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-jar
          path: inventory-service/build/libs/*.jar

      - name: Prepare Docker context
        run: |
          mkdir -p $DOCKER_CONTEXT_DIR
          cp inventory-service/build/libs/*.jar $DOCKER_CONTEXT_DIR/app.jar
          cp inventory-service/Dockerfile $DOCKER_CONTEXT_DIR/Dockerfile

      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: ~/.docker-cache/.buildx-cache
          key: docker-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.DOCKER_CONTEXT_DIR }}
          file: ${{ env.DOCKER_CONTEXT_DIR }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.INVENTORY_IMAGE_NAME }}:${{ env.INVENTORY_IMAGE_TAG }}
            ${{ env.INVENTORY_IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=local,src=~/.docker-cache/.buildx-cache
          cache-to: type=local,dest=~/.docker-cache/.buildx-cache

  deploy:
    runs-on: self-hosted
    environment: rpc3s
    needs: build-and-push
    env:
      ENV_PROFILE: ${{ secrets.ENV_PROFILE }}
      DOMAIN: ${{ secrets.DOMAIN }}
      INVENTORY_SERVICE_POSTGRES_USER: ${{ secrets.INVENTORY_SERVICE_POSTGRES_USER }}
      INVENTORY_SERVICE_POSTGRES_PASSWORD: ${{ secrets.INVENTORY_SERVICE_POSTGRES_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: Prepare k8s manifest
        run: |
          cp inventory-service/k8s.yaml template.yaml
          envsubst \
            '${ENV_PROFILE} ${DOMAIN} ${INVENTORY_IMAGE_NAME} ${INVENTORY_IMAGE_TAG} ${INVENTORY_SERVICE_POSTGRES_USER} ${INVENTORY_SERVICE_POSTGRES_PASSWORD}' \
            < template.yaml > inventory-service/k8s.yaml

      - name: Deploy to k8s
        run: |
          kubectl apply -f inventory-service/k8s.yaml --kubeconfig ~/.kube/config
          kubectl rollout restart deployment/inventory-service --namespace=ecommerce --kubeconfig ~/.kube/config

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/inventory-service --namespace=ecommerce --timeout=120s --kubeconfig ~/.kube/config