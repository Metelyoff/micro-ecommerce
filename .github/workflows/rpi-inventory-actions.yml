name: Deploy inventory service

on:
  push:
    branches: [k8s, main]
    paths:
      - 'inventory-service/**'
      - '.github/workflows/rpi-inventory-actions.yml'

env:
  IMAGE_NAME: ${{ secrets.INVENTORY_IMAGE_NAME }}
  DOCKER_CONTEXT_DIR: docker-context

jobs:
  test:
    runs-on: self-hosted
    environment: rpc3s
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle wrapper permissions
        run: chmod +x inventory-service/gradlew

      - name: Run tests with reports
        working-directory: inventory-service
        run: ./gradlew clean test --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: inventory-service/build/reports/tests/test

  build-and-push:
    runs-on: self-hosted
    environment: rpc3s
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Gradle wrapper permissions
        run: chmod +x inventory-service/gradlew

      - name: Build JAR with Gradle
        working-directory: inventory-service
        run: ./gradlew bootJar --no-daemon

      - name: Prepare Docker context
        run: |
          mkdir -p $DOCKER_CONTEXT_DIR
          cp inventory-service/build/libs/*.jar $DOCKER_CONTEXT_DIR/app.jar
          cp inventory-service/Dockerfile $DOCKER_CONTEXT_DIR/Dockerfile

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker disk cache
        run: mkdir -p /tmp/.buildx-cache

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.DOCKER_CONTEXT_DIR }}
          file: ${{ env.DOCKER_CONTEXT_DIR }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

  deploy:
    runs-on: self-hosted
    environment: rpc3s
    needs: build-and-push
    env:
      ENV_PROFILE: ${{ secrets.ENV_PROFILE }}
      DOMAIN: ${{ secrets.DOMAIN }}
      INVENTORY_SERVICE_POSTGRES_USER: ${{ secrets.INVENTORY_SERVICE_POSTGRES_USER }}
      INVENTORY_SERVICE_POSTGRES_PASSWORD: ${{ secrets.INVENTORY_SERVICE_POSTGRES_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: Prepare k8s manifest
        run: |
          cp inventory-service/k8s.yaml template.yaml
          envsubst \
            '${ENV_PROFILE} ${IMAGE_NAME} ${DOMAIN} ${INVENTORY_SERVICE_POSTGRES_USER} ${INVENTORY_SERVICE_POSTGRES_PASSWORD}' \
            < template.yaml > inventory-service/k8s.yaml

      - name: Deploy to k8s
        run: kubectl apply -f inventory-service/k8s.yaml --kubeconfig ~/.kube/config
