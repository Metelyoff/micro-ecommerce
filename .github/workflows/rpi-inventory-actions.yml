name: Deploy inventory service

on:
  push:
    branches: [k8s,main]
    paths:
      - 'inventory-service/**'
      - '.github/workflows/rpi-inventory-actions.yml'

env:
  IMAGE_NAME: ${{ secrets.INVENTORY_IMAGE_NAME }}

jobs:
  build-and-push:
    runs-on: self-hosted
    environment: rpc3s
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./inventory-service
          file: ./inventory-service/Dockerfile
          platforms: linux/arm64
          pull: true
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=shared-cache
          cache-to: type=gha,mode=max,scope=shared-cache

  deploy:
    runs-on: self-hosted
    environment: rpc3s
    needs: build-and-push
    env:
      ENV_PROFILE: ${{ secrets.ENV_PROFILE }}
      DOMAIN: ${{ secrets.DOMAIN }}
      INVENTORY_POSTGRES_USER: ${{ secrets.INVENTORY_POSTGRES_USER }}
      INVENTORY_POSTGRES_PASSWORD: ${{ secrets.INVENTORY_POSTGRES_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: Prepare ENV variables
        run: |
          cp inventory-service/k8s.yaml template.yaml
          envsubst \
            '${ENV_PROFILE} ${IMAGE_NAME} ${DOMAIN} ${INVENTORY_POSTGRES_USER} ${INVENTORY_POSTGRES_PASSWORD}' \
            < template.yaml > inventory-service/k8s.yaml

      - name: Apply manifest
        run: |
          kubectl apply -f inventory-service/k8s.yaml --kubeconfig ~/.kube/config
