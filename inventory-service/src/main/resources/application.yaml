spring:
  application:
    name: inventory-service
    max-reserved-items: 50
    cors:
      allowed-origins:
    outbox:
      listener:
        topics:
    security:
      csrf:
      cors:
  datasource:
    url:
    username:
    password:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      schema: public
      pool-name: inventory-pool
      connection-test-query: SELECT 1
      maximum-pool-size: 10 # for example (CPU cores × 2) + parallel queries
      minimum-idle: 5
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
  jpa:
    database: default
    show-sql: false
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        order_inserts: true
        order_updates: true
        generate_statistics: false
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 50
          time_zone: "UTC"
        log:
          non_contextual_creation: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:migrations
    baseline-on-migrate: true
    default-schema: ${spring.datasource.hikari.schema}
    fail-on-missing-locations: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    log-request-details: off
  kafka:
    bootstrap-servers:
    consumer:
      group-id: inventory-group

server:
  compression:
    enabled: true
    mime-types: application/json

logging:
  level:
    root: info

management:
  endpoint:
    health:
      access: read_only
      show-details: always # ok in the private network, must override to 'when_authorized' in the public
      show-components: always
      cache:
        time-to-live: 5s
    configprops: # secured info
      access: read_only
  endpoints:
    access:
      default: none
    web:
      exposure:
        # logfile,loggers,env,configprops,threaddump,flyway - useful, but does not safe
        include: info,health,metrics,prometheus,logfile,loggers,env,configprops,threaddump,flyway
      cors:
        # ok in the private network, must override to allow from the specified front end
        allowed-origins: "*"
        allowed-methods: GET
    jmx:
      exposure:
        exclude=*:
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    mail:
      enabled: false
  metrics:
    enable:
      logback: true
      jvm: true
      process:
        files: true
    distribution:
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
      percentiles-histogram:
        all: true
