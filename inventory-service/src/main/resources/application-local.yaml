spring:
  application:
    outbox:
      listener:
        topics: order-service.public.outbox_events,payment-service.public.outbox_events
    cors:
      allowed-origins: "*"
    security:
      csrf: false
      cors: false
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_service_db
    username: inventory
    password: inventory
  jpa:
    show-sql: true
    properties:
      hibernate:
        use_sql_comments: true
        type.descriptor.sql.BasicBinder: TRACE
  kafka:
    bootstrap-servers: localhost:29092

server:
  port: 8080

logging:
  level:
    com.ecommerce.inventory: debug
    org.flywaydb: debug
    org.hibernate.SQL: debug
    org.hibernate.stat: debug
    org.hibernate.cache: debug
    org.hibernate.transaction: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.engine.transaction: debug
    org.hibernate.type.descriptor.sql: trace
