apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ecommerce
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      initContainers:
        - name: wait-for-services
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              until nc -z order-service 8086 &&
                    nc -z payment-service 8085 &&
                    nc -z inventory-service 80;
              do
                echo "Waiting for services...";
                sleep 5;
              done
      containers:
        - name: web
          image: ${IMAGE_NAME}:webapp
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              value: "https://${DOMAIN}/api"
            - name: BACKEND_PRODUCTS_API_URL
              value: http://inventory-service
            - name: BACKEND_ORDERS_API_URL
              value: http://order-service:8086
            - name: BACKEND_PAYMENTS_API_URL
              value: http://payment-service:8085
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
