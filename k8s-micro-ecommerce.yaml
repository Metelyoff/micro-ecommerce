apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
provisioner: rancher.io/local-path
reclaimPolicy: Delete
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-postgres-init-sql
  namespace: ecommerce
data:
  order_init.sql: |
    \c postgres;
    DROP DATABASE IF EXISTS order_service_db;
    CREATE DATABASE order_service_db;
    \c order_service_db;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-postgres-config
  namespace: ecommerce
data:
  postgresql.conf: |
    listen_addresses = '*'
    max_connections = 100
    shared_buffers = 128MB
    dynamic_shared_memory_type = posix
    max_wal_size = 1GB
    min_wal_size = 80MB
    log_timezone = 'Etc/UTC'
    timezone = 'Etc/UTC'
    lc_messages = 'en_US.utf8'
    lc_monetary = 'en_US.utf8'
    lc_numeric = 'en_US.utf8'
    lc_time = 'en_US.utf8'
    default_text_search_config = 'pg_catalog.english'
    wal_level = logical
    max_replication_slots = 10
    max_wal_senders = 10
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-postgres
  namespace: ecommerce
spec:
  serviceName: "order-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: order-postgres
  template:
    metadata:
      labels:
        app: order-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: order-postgres-data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/order_init.sql
              subPath: order_init.sql
          env:
            - name: POSTGRES_USER
              value: "${ORDER_POSTGRES_USER}"
            - name: POSTGRES_PASSWORD
              value: "${ORDER_POSTGRES_PASSWORD}"
            - name: POSTGRES_DB
              value: order_service_db
          args:
            - "-c"
            - "config_file=/etc/postgresql/postgresql.conf"
          readinessProbe:
            exec:
              command: [ "pg_isready", "-U", "postgres" ]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: order-postgres-config
        - name: init-sql
          configMap:
            name: order-postgres-init-sql
  volumeClaimTemplates:
    - metadata:
        name: order-postgres-data
      spec:
        storageClassName: local-path
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-db
  namespace: ecommerce
spec:
  selector:
    app: order-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
