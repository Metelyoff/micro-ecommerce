apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-postgres-init-sql
  namespace: ecommerce
data:
  inventory_init.sql: |
    \c postgres;
    CREATE DATABASE inventory_service_db;
    
    CREATE ROLE ${INVENTORY_SERVICE_POSTGRES_USER} WITH
        PASSWORD '${INVENTORY_SERVICE_POSTGRES_PASSWORD}'
        LOGIN
        REPLICATION
        NOSUPERUSER
        NOCREATEDB
        NOCREATEROLE
        NOINHERIT
        NOBYPASSRLS
        CONNECTION LIMIT -1;
    
    GRANT CONNECT ON DATABASE inventory_service_db TO ${INVENTORY_SERVICE_POSTGRES_USER};
    
    \c inventory_service_db;
    GRANT CREATE, USAGE ON SCHEMA public TO ${INVENTORY_SERVICE_POSTGRES_USER};
