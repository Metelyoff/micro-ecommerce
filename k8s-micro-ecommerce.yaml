            - name: GF_SMTP_HOST
              value: "smtp.resend.com:587"
            - name: GF_SMTP_USER
              value: "resend"
            - name: GF_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-smtp-secret
                  key: smtp-password
