apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
        - name: kafka
          image: apache/kafka:latest
          ports:
            - containerPort: 29092
            - containerPort: 29093
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka:29092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:29093"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://:29092,CONTROLLER://:29093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
            - name: CLUSTER_ID
              value: "ecommerce"
#          resources:
#            limits:
#              memory: "512Mi"
#              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ecommerce
spec:
  selector:
    app: kafka
  ports:
    - name: internal
      protocol: TCP
      port: 29092
      targetPort: 29092
    - name: controller
      protocol: TCP
      port: 29093
      targetPort: 29093
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui-ingress
  namespace: ecommerce
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: kafka.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      initContainers:
        - name: wait-for-kafka
          image: busybox
          command: [ 'sh', '-c', 'until nc -z kafka 29092; do echo "Waiting for Kafka..."; sleep 2; done' ]
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "ecommerce"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka:29092"
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: ecommerce
spec:
  selector:
    app: kafka-ui
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium
  template:
    metadata:
      labels:
        app: debezium
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      initContainers:
        - name: wait-for-postgres
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              until nc -z order-service-db 5432 &&
                    nc -z payment-service-db 5432 &&
                    nc -z inventory-service-db 5432;
              do
                echo "Waiting for Postgres...";
                sleep 2;
              done
        - name: wait-for-kafka
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - until nc -z kafka 29092; do echo "Waiting for Kafka..."; sleep 2; done
      containers:
        - name: debezium
          image: quay.io/debezium/connect
          ports:
            - containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: kafka:29092
            - name: GROUP_ID
              value: "1"
            - name: CONFIG_STORAGE_TOPIC
              value: debezium_config
            - name: OFFSET_STORAGE_TOPIC
              value: debezium_offsets
            - name: STATUS_STORAGE_TOPIC
              value: debezium_status
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_KEY_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: CONNECT_ACCESS_CONTROL_ALLOW_ORIGIN
              value: "*"
            - name: CONNECT_ACCESS_CONTROL_ALLOW_METHODS
              value: "GET"
            - name: CONNECT_ACCESS_CONTROL_ALLOW_HEADERS
              value: "origin,content-type,accept,authorization"
#          resources:
#            limits:
#              memory: "512Mi"
#              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: debezium
  namespace: ecommerce
spec:
  selector:
    app: debezium
  ports:
    - protocol: TCP
      port: 8083
      targetPort: 8083
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: debezium-ingress
  namespace: ecommerce
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: debezium.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: debezium
                port:
                  number: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-ui
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium-ui
  template:
    metadata:
      labels:
        app: debezium-ui
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      initContainers:
        - name: wait-for-debezium
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Waiting for Debezium to become available..."
              until wget -q --spider http://debezium:8083; do
                echo "Debezium not ready, retrying..."
                sleep 3
              done
              echo "Debezium is ready!"
      containers:
        - name: debezium-ui
          image: docker.io/metelyoff/debezium-ui-arm64:latest
          ports:
            - containerPort: 80
          env:
            - name: KAFKA_CONNECT_CLUSTERS
              value: "http://debezium.local/,http://debezium:8083/"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-ui
  namespace: ecommerce
spec:
  selector:
    app: debezium-ui
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: debezium-ui-ingress
  namespace: ecommerce
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: debezium-ui.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: debezium-ui
                port:
                  number: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-connectors
  namespace: ecommerce
data:
  register-connectors.sh: |
    #!/bin/sh
    echo "Registering connectors"
    for f in /connectors/*.json; do
      name=$(grep -o '"name"[[:space:]]*:[[:space:]]*"[^"]*"' "$f" | head -n1 | cut -d':' -f2 | tr -d ' "')
      echo "Registering connector: $name"
      response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
        -H "Content-Type: application/json" \
        --data @"$f" http://debezium:8083/connectors)
    
      if [ "$response" -eq 201 ]; then
        echo "Registered $name"
      elif [ "$response" -eq 200 ]; then
        echo "Registered $name"
      elif [ "$response" -eq 409 ]; then
        echo "Connector $name already exists"
      else
        echo "Failed to register $name (HTTP $response)"
      fi
    done
  inventory-service-connector.json: |
    {
      "name": "inventory-service-connector",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "database.hostname": "inventory-service-db",
        "database.port": "5432",
        "database.user": "${INVENTORY_SERVICE_POSTGRES_USER}",
        "database.password": "${INVENTORY_SERVICE_POSTGRES_PASSWORD}",
        "database.dbname": "inventory_service_db",
        "database.server.name": "inventory_service",
        "plugin.name": "pgoutput",
        "slot.name": "debezium_slot",
        "topic.prefix": "inventory-service",
        "key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter.schemas.enable": "false",
        "decimal.handling.mode": "string",
        "include.transaction": true,
        "after.state.only": "true",
        "transforms": "unwrap",
        "transforms.unwrap.type": "io.debezium.transforms.ExtractNewRecordState",
        "transforms.unwrap.drop.tombstones": "true",
        "table.include.list": "public.outbox_events",
        "publication.name": "dbz_publication",
        "publication.autocreate.mode": "disabled"
      }
    }
  order-service-connector.json: |
    {
      "name": "order-service-connector",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "database.hostname": "order-service-db",
        "database.port": "5432",
        "database.user": "${ORDER_POSTGRES_USER}",
        "database.password": "${ORDER_POSTGRES_PASSWORD}",
        "database.dbname": "order_service_db",
        "database.server.name": "order_service",
        "plugin.name": "pgoutput",
        "slot.name": "debezium_slot",
        "topic.prefix": "order-service",
        "key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter.schemas.enable": "false",
        "decimal.handling.mode": "string",
        "include.transaction": true,
        "after.state.only": "true",
        "transforms": "unwrap",
        "transforms.unwrap.type": "io.debezium.transforms.ExtractNewRecordState",
        "transforms.unwrap.drop.tombstones": "true",
        "table.include.list": "public.outbox_events"
      }
    }
  payment-service-connector.json: |
    {
      "name": "payment-service-connector",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "tasks.max": "1",
        "database.hostname": "payment-service-db",
        "database.port": "5432",
        "database.user": "${PAYMENT_POSTGRES_USER}",
        "database.password": "${PAYMENT_POSTGRES_PASSWORD}",
        "database.dbname": "payment_service_db",
        "database.server.name": "payment_service",
        "plugin.name": "pgoutput",
        "slot.name": "debezium_slot",
        "topic.prefix": "payment-service",
        "key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter.schemas.enable": "false",
        "decimal.handling.mode": "string",
        "include.transaction": true,
        "after.state.only": "true",
        "transforms": "unwrap",
        "transforms.unwrap.type": "io.debezium.transforms.ExtractNewRecordState",
        "transforms.unwrap.drop.tombstones": "true",
        "table.include.list": "public.outbox_events"
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-connector
  namespace: ecommerce
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-debezium
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Waiting for Debezium to become available..."
              until wget -q --spider http://debezium:8083/connectors; do
                echo "Debezium not ready, retrying..."
                sleep 3
              done
              echo "Debezium is ready!"
      containers:
        - name: debezium-connector
          image: curlimages/curl
          command: [ "sh", "/connectors/register-connectors.sh" ]
          volumeMounts:
            - name: connector-configs
              mountPath: /connectors
      volumes:
        - name: connector-configs
          configMap:
            name: debezium-connectors
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecommerce
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
