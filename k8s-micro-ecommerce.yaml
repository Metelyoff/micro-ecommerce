  creds.json: "${CLOUDFLARE_TUNNEL_TOKEN}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      initContainers:
        - name: wait-for-web
          image: curlimages/curl
          command: [ 'sh', '-c', 'until curl -s web:80 > /dev/null; do echo waiting for web; sleep 2; done;' ]
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - run
            - rpik3s-tunnel
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yml
              subPath: config.yml
            - name: creds
              mountPath: /etc/cloudflared/creds.json
              subPath: creds.json
      volumes:
        - name: config
          configMap:
            name: cloudflared-config
        - name: creds
          secret:
            secretName: cloudflared-creds
